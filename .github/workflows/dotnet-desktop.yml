name: Continuous Integration

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read  #  to fetch code (actions/checkout)

jobs:
  linux:
    name: Linux 
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
            submodules: 'true'

      - name: Install .NET 8.0 and .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
         dotnet-version: | 
            8.0.x
            10.0.x

      - name: Build
        run: |
          dotnet clean src/TrainingHelper.slnx -c Debug --nologo --verbosity minimal 
          dotnet build src/TrainingHelper.slnx -c Debug -nologo -warnaserror

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
            submodules: 'true'

      - name: Install .NET 8.0 and .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: | 
            8.0.x
            10.0.x
      - name: Build
        shell: powershell
        run: |
          dotnet clean src/TrainingHelper.slnx -c Debug --nologo --verbosity minimal 
          dotnet build src/TrainingHelper.slnx -c Debug -nologo -warnaserror
